// ---------- Effekter ----------
let dust = [], bits = [], confetti = [], banners = [], ripples = [], smoke = [], birds = [], flakes = [];
let lastFrame = performance.now(), shake = 0, excite = 0, nextBirds = performance.now() + 5000, smokeT = 0;
const cam = { x: WW / 2, y: WH / 2, z: 1 };
const BIT_COLORS = {
  spark: ['#fff3b0', '#ffd23f', '#ff9f1c'], leaf: ['#2e6a3e', '#3f8a3a', '#6cb85a'], straw: ['#f2d479', '#d9b24c', '#fff0a8'],
  rock: ['#a0a6ad', '#6b7075'], gravel: ['#6d5231', '#d8c09a', '#8a6a3e'], grass: ['#3f7f3a', '#5a9a45', '#6d5a36'],
  snow: ['#ffffff', '#e6eef7', '#cfdceb'], splash: ['#7d8a91', '#a9bcc8', '#5c4a36'], water: ['#9fd0f0', '#e8f6ff', '#5aa0cc'],
};
function spawnBits(x, y, n, kind, dx = 0, dy = 0) {
  for (let k = 0; k < n && bits.length < 500; k++) {
    const an = Math.random() * 6.283, sp = kind === 'spark' ? 150 + Math.random() * 250 : 40 + Math.random() * 120;
    const life = kind === 'spark' ? .25 + Math.random() * .2 : .4 + Math.random() * .5;
    bits.push({
      kind, x, y, h: 2, vh: kind === 'spark' ? 20 : 25 + Math.random() * 35, vx: Math.cos(an) * sp + dx, vy: Math.sin(an) * sp + dy, life, max: life,
      size: kind === 'leaf' || kind === 'straw' || kind === 'snow' ? 2.5 + Math.random() * 2 : 1.5 + Math.random() * 1.5, color: pick(BIT_COLORS[kind]),
    });
  }
}
const CONF = ['#ff4747', '#2f9bff', '#ffcc1f', '#34d06a', '#ff8a1f', '#a86bff', '#ff5fae', '#ffffff'];
const makeConf = (x, y, vx, vy) => ({ x, y, vx, vy, rot: Math.random() * 6, vr: (Math.random() - .5) * 10, col: pick(CONF), life: 6, w: 7 + Math.random() * 5, h: 4 + Math.random() * 3 });
function confettiBurst() {
  const q = T.s[0], x = WW / 2 + cam.z * (q.x - cam.x), y = WH / 2 + cam.z * (q.y - 30 - cam.y);
  for (let k = 0; k < 140; k++) {
    const an = -Math.PI / 2 + (Math.random() - .5) * 2.2, sp = 250 + Math.random() * 450;
    confetti.push(makeConf(x, y, Math.cos(an) * sp, Math.sin(an) * sp));
  }
}
function banner(text, gold, color) {
  banners.push({ text, gold, color });
  if (banners.length > 4) banners.splice(1, 1);
}

// ---------- Kamera: zoomar in på klungan som en TV-sändning ----------
function updateCam(fdt, now, list) {
  let tx = WW / 2, ty = WH / 2, tz = 1;
  if ((state === 'race' || state === 'countdown') && list.length) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of list) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
    const m = state === 'countdown' ? 170 : 240;
    x0 -= m; x1 += m; y0 -= m + 50; y1 += m;
    tz = clamp(Math.min(WW / (x1 - x0), WH / (y1 - y0)), 1, state === 'countdown' ? 1.9 : 1.45);
    tx = (x0 + x1) / 2; ty = (y0 + y1) / 2;
  } else {
    const t = now / 1000;
    tz = 1.07; tx = WW / 2 + Math.sin(t * .07) * 45; ty = WH / 2 + Math.cos(t * .09) * 24;
  }
  const k = 1 - Math.exp(-fdt * (state === 'race' ? 1.5 : 1.1));
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; cam.z += (tz - cam.z) * k;
  const hw = WW / 2 / cam.z, hh = WH / 2 / cam.z;
  cam.x = clamp(cam.x, hw, WW - hw); cam.y = clamp(cam.y, hh, WH - hh);
}

// ---------- Ritning ----------
function draw() {
  requestAnimationFrame(draw);
  const now = performance.now(), fdt = Math.min((now - lastFrame) / 1000, .1);
  lastFrame = now;
  const dpr = devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  const sc = Math.min(w / WW, h / WH), ox = (w - WW * sc) / 2, oy = (h - WH * sc) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0a0c14';
  ctx.fillRect(0, 0, cv.width, cv.height);
  excite = Math.max(0, excite - fdt);
  const list = racers();
  updateCam(fdt, now, list);

  // Världen (med kamera)
  ctx.save();
  ctx.beginPath(); ctx.rect(dpr * ox, dpr * oy, dpr * WW * sc, dpr * WH * sc); ctx.clip();
  const Z = sc * cam.z;
  let tx = ox + sc * WW / 2 - Z * cam.x, ty = oy + sc * WH / 2 - Z * cam.y;
  if (shake > .3) { tx += (Math.random() - .5) * shake * Z; ty += (Math.random() - .5) * shake * Z; }
  shake *= Math.pow(.002, fdt);
  ctx.setTransform(dpr * Z, 0, 0, dpr * Z, dpr * tx, dpr * ty);
  ctx.drawImage(bg, 0, 0, WW, WH);
  ctx.drawImage(skid, 0, 0, WW, WH);
  drawGroundFx(now, fdt);
  drawWorldObjects(list, now);
  drawGantryTop();
  drawDust(fdt);
  drawBits(fdt);
  drawSmoke(now, fdt);
  drawBirds(now, fdt);
  ctx.globalAlpha = TH.cloud;
  for (const c of clouds) {
    c.x += c.v * fdt;
    if (c.x > WW + 100) c.x = -520 * c.s - 100;
    ctx.drawImage(cloudSpr, c.x, c.y, 520 * c.s, 320 * c.s);
  }
  ctx.globalAlpha = 1;
  drawTags(list);
  ctx.restore();

  // Skärmlager: färgton, vinjett, snöfall, konfetti, HUD
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
  ctx.globalCompositeOperation = 'soft-light';
  ctx.drawImage(gradeSpr, 0, 0, WW, WH);
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(vig, 0, 0, WW, WH);
  drawSnow(now, fdt);
  drawConfetti(now, fdt);
  if (state === 'countdown' || state === 'race') drawHud(now);
  drawLights(now);
  drawAnnounce(now);

  const pre = state === 'lobby' || state === 'countdown';
  Sound.engines(list.map(p => {
    const sp = Math.hypot(p.vx, p.vy), pressed = !!(p.s || p.b);
    return {
      id: p.id, slot: p.c, speed: pre ? 0 : sp, rev: pre ? (pressed ? .95 : .1) : null,
      on: state === 'race' || state === 'countdown' || (state === 'lobby' && pressed),
      skid: state === 'race' ? clamp((p.slide - 60) / 200, 0, 1) + (p.off && sp > 60 ? .4 : 0) : 0,
    };
  }));
  Sound.ambience(state === 'race' ? .02 + Math.min(excite, 1) * .05 : .006, TH.snow ? .05 : 0);
}
const clouds = [{ x: 100, y: 40, s: 1.6, v: 9 }, { x: 800, y: 420, s: 1.3, v: 12 }, { x: 1300, y: 120, s: 1.8, v: 7 }, { x: -400, y: 560, s: 1.4, v: 10 }];

function drawGroundFx(now, fdt) {
  const t = now / 1000, Lk = T.lake;
  if (Lk) {
    if (!TH.snow && Math.random() < fdt * 1.2) {
      const b = pick(Lk.blobs), an = Math.random() * 6.28, d = Math.random() * b.r * .7;
      ripples.push({ x: b.x + Math.cos(an) * d, y: b.y + Math.sin(an) * d, r: 1, life: 2.2, max: 2.2 });
    }
    ctx.fillStyle = '#fff';
    for (const s of Lk.sparks) {
      const a = Math.max(0, Math.sin(t * 1.7 + s.ph)) ** 12;
      if (a < .05) continue;
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.moveTo(s.x, s.y - 3); ctx.lineTo(s.x + .8, s.y); ctx.lineTo(s.x, s.y + 3); ctx.lineTo(s.x - .8, s.y); ctx.fill();
      ctx.fillRect(s.x - 2.5, s.y - .4, 5, .8);
    }
    ctx.globalAlpha = 1;
  }
  ripples = ripples.filter(r => (r.life -= fdt) > 0);
  ctx.lineWidth = .9;
  for (const r of ripples) {
    r.r += 9 * fdt;
    ctx.strokeStyle = `rgba(255,255,255,${(r.life / r.max) * .5})`;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * .7, 0, 0, 7); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 1.4;
  for (const b of birds) birdShape(b.x + SUN.x * b.h, b.y + SUN.y * b.h, Math.sin(t * 11 + b.ph) * 3.2);
}

// Allt med höjd ritas bakifrån och fram (sorterat på y) så att det överlappar rätt
function drawWorldObjects(list, now) {
  const cars = list.slice().sort((a, b) => a.y - b.y);
  const vx0 = cam.x - WW / 2 / cam.z - 60, vx1 = cam.x + WW / 2 / cam.z + 60;
  const vy0 = cam.y - WH / 2 / cam.z - 20, vy1 = cam.y + WH / 2 / cam.z + 140;
  let ci = 0;
  for (const it of T.statics) {
    while (ci < cars.length && cars[ci].y < it.y) drawCar(cars[ci++], now);
    if (it.x < vx0 || it.x > vx1 || it.y < vy0 || it.y > vy1) continue;
    if (it.k === 'tree' || it.k === 'house') ctx.drawImage(it.spr, it.x - it.ax, it.y - it.ay, it.sw, it.sh);
    else if (it.k === 'person') drawPerson(it, now, list);
    else if (it.k === 'post') drawPost(it);
    else if (it.k === 'flag') drawFlagpole(it, now);
  }
  while (ci < cars.length) drawCar(cars[ci++], now);
}

const WHEELS = [[-10.5, -8.4, 0], [-10.5, 8.4, 0], [10.5, -8.4, 1], [10.5, 8.4, 1]];
function drawCar(p, now) {
  const set = carSets[p.c], sp = Math.hypot(p.vx, p.vy);
  const pop = clamp((now - p.spawnT) / 450, 0, 1), s = pop < 1 ? Math.max(.01, easeOutBack(pop)) : 1;
  const roll = -(p.s || 0) * clamp(sp / 300, 0, 1) * .12;       // karossen lutar utåt i kurvor
  const pitch = p.b && sp > 20 ? .07 : 0;                          // nosen dyker vid inbromsning
  const bounce = p.off && sp > 40 ? Math.sin(now * .045 + p.c * 2) * .7 : 0;
  const atLayer = (h, fn) => {
    ctx.save();
    ctx.translate(0, -(h * s + bounce) * TILT); ctx.rotate(p.a); ctx.translate(pitch * h, roll * h); ctx.scale(s, s);
    fn();
    ctx.restore();
  };
  const layer = (spr, h, a) => atLayer(h, () => { if (a != null) ctx.globalAlpha = a; ctx.drawImage(spr, -CAR_SW / 2, -CAR_SH / 2, CAR_SW, CAR_SH); });

  ctx.save(); ctx.translate(p.x + SUN.x * 6, p.y + SUN.y * 6); ctx.rotate(p.a); ctx.scale(s, s);
  ctx.drawImage(shadowSpr, -CAR_SW / 2, -CAR_SH / 2, CAR_SW, CAR_SH);
  ctx.restore();

  ctx.save(); ctx.translate(p.x, p.y);
  const st = p.done || state === 'results' ? 0 : (p.s || 0) * .45;
  for (let h = 0; h <= 3.6; h += .9) {
    ctx.save(); ctx.translate(0, -h * s * TILT); ctx.rotate(p.a); ctx.scale(s, s);
    ctx.fillStyle = h > 1.5 && h < 2.5 ? '#3a3d45' : '#141518';
    for (const [wx, wy, fr] of WHEELS) {
      ctx.save(); ctx.translate(wx, wy); if (fr) ctx.rotate(st);
      ctx.beginPath(); ctx.roundRect(-4, -2.2, 8, 4.4, 1.6); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  const mud = TH.snow ? set.snow : set.mud;
  layer(set.under, 1.5);
  for (let h = 2; h < 4; h += .4) layer(set.side[0], h);
  for (let h = 4; h < 5.2; h += .4) layer(set.side[1], h);
  layer(set.stripe, 5.2); layer(set.stripe, 5.5);
  for (let h = 5.8; h < 7.4; h += .4) layer(set.side[2], h);
  if (p.dirt > .03) for (const h of [2.4, 3.6, 4.8, 6.2]) layer(mud, h, p.dirt * .9);
  layer(set.top, 7.5);
  if (p.dirt > .03) layer(mud, 7.6, p.dirt * .45);
  layer(set.lamps, 8); layer(set.lamps, 8.4);
  layer(set.mirrors, 8.6);
  layer(set.posts, 8.3); layer(set.posts, 9); layer(set.posts, 9.7);
  for (let h = 8; h < 9; h += .4) layer(set.glass[0], h);
  for (let h = 9; h < 10; h += .4) layer(set.glass[1], h);
  for (let h = 10; h < 11.1; h += .4) layer(set.glass[2], h);
  layer(set.wing, 10.4); layer(set.wing, 10.8);
  layer(set.roof, 11.3); layer(set.roof, 11.6);

  ctx.globalCompositeOperation = 'lighter';
  if (state === 'race' && !p.done) atLayer(8.2, () => {
    for (const y of [-5.4, -1.8, 1.8, 5.4]) {
      const gr = ctx.createRadialGradient(15, y, 0, 15, y, 4.5);
      gr.addColorStop(0, 'rgba(255,250,220,.55)'); gr.addColorStop(1, 'rgba(255,250,220,0)');
      ctx.fillStyle = gr; ctx.fillRect(10, y - 5, 10, 10);
    }
  });
  if (p.b || (p.done && sp > 15)) atLayer(6, () => {
    for (const y of [-5.6, 5.6]) {
      const gr = ctx.createRadialGradient(-18, y, 0, -18, y, 8);
      gr.addColorStop(0, 'rgba(255,50,50,.9)'); gr.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = gr; ctx.fillRect(-26, y - 8, 16, 16);
    }
  });
  if (now - p.flameT < 110) atLayer(2.5, () => {
    const len = 7 + Math.random() * 6;
    const gr = ctx.createRadialGradient(-19, 5.4, 0, -19 - len * .5, 5.4, len);
    gr.addColorStop(0, 'rgba(255,255,220,1)'); gr.addColorStop(.35, 'rgba(255,170,40,.9)'); gr.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(-19 - len * .5, 5.4, len, 3, 0, 0, 7); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

function drawPerson(c, now, list) {
  const t = now / 1000;
  let near = excite > 0;
  if (!near) for (const p of list) if (Math.abs(p.x - c.x) < 150 && Math.abs(p.y - c.y) < 150) { near = true; break; }
  const jump = near ? Math.abs(Math.sin(t * 11 + c.ph)) * 4 : (Math.sin(t * 2 + c.ph) + 1) * .3;
  const x = c.x, y = c.y - jump * TILT;
  ctx.fillStyle = '#2b2f3a'; ctx.fillRect(x - 2.4, y - 5 * TILT, 4.8, 5 * TILT + .5);
  ctx.fillStyle = c.shirt; ctx.beginPath(); ctx.roundRect(x - 4.4, y - 11 * TILT, 8.8, 6.5 * TILT, 2.5); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(x + 1.6, y - 10.5 * TILT, 2.6, 5.6 * TILT);
  if (c.flag) {
    const fx = x + 4.5, top = y - 27 * TILT;
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = .7; ctx.beginPath(); ctx.moveTo(fx, y - 9 * TILT); ctx.lineTo(fx, top); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const yy = top + Math.sin(t * 7 + c.ph - i * .8) * .8 * (i / 3);
      ctx.fillStyle = c.flag === 'se' ? '#006aa7' : c.flag; ctx.fillRect(fx + i * 2.3, yy, 2.5, 6);
      ctx.fillStyle = c.flag === 'se' ? '#fecc00' : 'rgba(255,255,255,.85)';
      ctx.fillRect(fx + i * 2.3, yy + 2.4, 2.5, 1.2);
      if (c.flag === 'se' && i === 1) ctx.fillRect(fx + i * 2.3, yy, 1.4, 6);
    }
  }
  if (near) {
    ctx.fillStyle = c.skin;
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(x + sx * 5.2, y - 14.5 * TILT, 1.5, 0, 7); ctx.fill(); }
  }
  ctx.fillStyle = c.skin; ctx.beginPath(); ctx.arc(x, y - 12.6 * TILT, 2.8, 0, 7); ctx.fill();
  ctx.fillStyle = c.hat || c.hair; ctx.beginPath(); ctx.arc(x - .2, y - 13.4 * TILT, c.hat ? 2.7 : 2.3, Math.PI, 0); ctx.fill();
  if (c.hat) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y - 16.6 * TILT, 1.1, 0, 7); ctx.fill(); }
  if (near && Math.random() < .004) c.flashT = now;
  if (now - c.flashT < 90) {
    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(x, y - 12 * TILT, 0, x, y - 12 * TILT, 18);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr; ctx.fillRect(x - 18, y - 12 * TILT - 18, 36, 36);
    ctx.globalCompositeOperation = 'source-over';
  }
}

function drawPost(it) {
  for (let z = 0; z <= 38; z += 1) {
    ctx.fillStyle = z > 37 ? '#5a6070' : mix('#1c1f27', '#3a3f4c', z / 38);
    ctx.fillRect(it.x - 3.5, it.y - z * TILT - 3.5, 7, 7);
  }
}

function drawFlagpole(it, now) {
  const H = 58, top = it.y - H * TILT, t = now / 1000;
  ctx.strokeStyle = '#eeeeee'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(it.x, it.y); ctx.lineTo(it.x, top - 2); ctx.stroke();
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(it.x, top - 2.5, 1.7, 0, 7); ctx.fill();
  const Wf = 24, Hf = 15, cols = 16;
  for (let i = 0; i < cols; i++) {
    const u = i / cols, ph = t * 5 - i * .5, y = top + Math.sin(ph) * u * 2.6, l = .82 + Math.cos(ph) * .18 * u;
    const x = it.x + 1 + u * Wf, w = Wf / cols + .4;
    ctx.fillStyle = `rgb(0,${Math.round(106 * l)},${Math.round(167 * l)})`;
    ctx.fillRect(x, y, w, Hf);
    ctx.fillStyle = `rgb(${Math.round(254 * l)},${Math.round(204 * l)},0)`;
    ctx.fillRect(x, y + Hf * .4, w, Hf * .2);
    if (i === 5 || i === 6) ctx.fillRect(x, y, w, Hf);
  }
}

function drawGantryTop() {
  const q = T.s[0], L = HALF_W + 14;
  for (let z = 31; z <= 38; z += .5) {
    ctx.save(); ctx.translate(q.x, q.y - z * TILT); ctx.rotate(q.a);
    if (z < 38) { ctx.fillStyle = mix('#5e0a10', '#b3121b', (z - 31) / 7); ctx.fillRect(-5.5, -L, 11, 2 * L); }
    else {
      const gr = ctx.createLinearGradient(-6, 0, 6, 0);
      gr.addColorStop(0, '#a50f18'); gr.addColorStop(.5, '#f04452'); gr.addColorStop(1, '#a50f18');
      ctx.fillStyle = gr; ctx.fillRect(-5.5, -L, 11, 2 * L);
      for (let k = 0; k < 4; k++) for (let j = 0; j < 2; j++) {
        ctx.fillStyle = (k + j) % 2 ? '#111' : '#fff';
        ctx.fillRect(-5.5 + j * 5.5, -L + k * 4, 5.5, 4); ctx.fillRect(-5.5 + j * 5.5, L - 16 + k * 4, 5.5, 4);
      }
      ctx.rotate(Math.PI / 2);
      ctx.fillStyle = '#fff'; ctx.font = '9px "Russo One", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('START  •  MÅL', 0, .5);
      ctx.textBaseline = 'alphabetic';
    }
    ctx.restore();
  }
}

function drawDust(fdt) {
  dust = dust.filter(q => (q.life -= fdt) > 0);
  for (const q of dust) {
    q.x += q.vx * fdt; q.y += q.vy * fdt; q.vx *= 1 - 1.5 * fdt; q.vy *= 1 - 1.5 * fdt; q.r += 18 * fdt; q.h += 7 * fdt;
    ctx.globalAlpha = (q.life / q.max) * .42;
    ctx.drawImage(q.spr, q.x - q.r, q.y - q.h * TILT - q.r, q.r * 2, q.r * 2);
  }
  ctx.globalAlpha = 1;
}

function drawBits(fdt) {
  bits = bits.filter(b => (b.life -= fdt) > 0);
  for (const b of bits) {
    const fr = 1 - (b.kind === 'spark' ? 2 : 4) * fdt;
    b.x += b.vx * fdt; b.y += b.vy * fdt; b.vx *= fr; b.vy *= fr;
    b.vh -= 140 * fdt; b.h = Math.max(0, b.h + b.vh * fdt);
    const a = b.life / b.max, y = b.y - b.h * TILT;
    if (b.kind === 'spark') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a; ctx.strokeStyle = b.color; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(b.x, y); ctx.lineTo(b.x - b.vx * .04, y - b.vy * .04); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    } else {
      ctx.globalAlpha = Math.min(1, a * 1.5); ctx.fillStyle = b.color;
      ctx.fillRect(b.x - b.size / 2, y - b.size / 2, b.size, b.size);
    }
  }
  ctx.globalAlpha = 1;
}

function drawSmoke(now, fdt) {
  const H = T.house;
  if (H && now > smokeT) {
    smokeT = now + 150;
    smoke.push({ x: H.cx, y: H.cy, r: 2.5, life: 3.2, max: 3.2, vx: 7 + Math.random() * 4, vy: -11 - Math.random() * 5 });
  }
  smoke = smoke.filter(s => (s.life -= fdt) > 0);
  for (const s of smoke) {
    s.x += s.vx * fdt; s.y += s.vy * fdt; s.r += 5 * fdt;
    ctx.globalAlpha = (s.life / s.max) * (TH.snow ? .45 : .28);
    ctx.drawImage(smokeSpr, s.x - s.r, s.y - s.r, s.r * 2, s.r * 2);
  }
  ctx.globalAlpha = 1;
}

function birdShape(x, y, wing) {
  ctx.beginPath();
  ctx.moveTo(x - 5, y + wing); ctx.quadraticCurveTo(x - 2, y - 1, x, y); ctx.quadraticCurveTo(x + 2, y - 1, x + 5, y + wing);
  ctx.stroke();
}
function drawBirds(now, fdt) {
  if (now > nextBirds) {
    nextBirds = now + 14000 + Math.random() * 16000;
    const fromLeft = Math.random() < .5, y = 200 + Math.random() * 560, n = 4 + Math.floor(Math.random() * 4);
    const vx = (fromLeft ? 1 : -1) * (80 + Math.random() * 40), vy = (Math.random() - .5) * 30, h = 120 + Math.random() * 60;
    for (let i = 0; i < n; i++) {
      const row = Math.ceil(i / 2), side = i % 2 ? 1 : -1;
      birds.push({ x: (fromLeft ? -60 : WW + 60) - Math.sign(vx) * row * 16, y: y + side * row * 12, vx, vy, h, ph: Math.random() * 6 });
    }
    if (!TH.snow) Sound.chirp();
  }
  const t = now / 1000;
  ctx.strokeStyle = '#24272e'; ctx.lineWidth = 1.5;
  for (const b of birds) {
    b.x += b.vx * fdt; b.y += b.vy * fdt;
    birdShape(b.x, b.y - b.h * TILT, Math.sin(t * 11 + b.ph) * 3.2);
  }
  birds = birds.filter(b => b.x > -200 && b.x < WW + 200);
}

function drawSnow(now, fdt) {
  if (!TH.snow) return;
  while (flakes.length < 240) flakes.push({ x: Math.random() * WW, y: Math.random() * WH, z: .3 + Math.random() * .7, ph: Math.random() * 6 });
  ctx.fillStyle = '#fff';
  for (const f of flakes) {
    f.y += (16 + 44 * f.z) * fdt;
    f.x += (Math.sin(now / 900 + f.ph) * 12 + 14) * f.z * fdt;
    if (f.y > WH + 5) { f.y = -5; f.x = Math.random() * WW; }
    if (f.x > WW + 5) f.x = -5;
    ctx.globalAlpha = .4 + f.z * .55;
    ctx.beginPath(); ctx.arc(f.x, f.y, .7 + f.z * 2, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTags(list) {
  const leader = state === 'race' && list.length > 1 ? ranking()[0] : null;
  ctx.font = '800 11px Inter, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of list) {
    const w = ctx.measureText(p.name).width + 18, x = p.x, y = p.y - 12 * TILT - 16;
    ctx.fillStyle = 'rgba(10,12,22,.62)'; ctx.beginPath(); ctx.roundRect(x - w / 2, y - 8, w, 16, 8); ctx.fill();
    ctx.fillStyle = COLORS[p.c]; ctx.beginPath(); ctx.arc(x - w / 2 + 7.5, y, 3, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(p.name, x + 4, y + .5);
    if (p === leader) {
      ctx.save(); ctx.translate(x, y - 14); ctx.scale(.8, .8);
      ctx.fillStyle = '#ffcc1f'; ctx.strokeStyle = '#7a5200'; ctx.lineWidth = 1;
      ctx.beginPath();
      [[-8, 4], [-8, -3], [-4, 1], [0, -5], [4, 1], [8, -3], [8, 4]].forEach(([a, b], k) => k ? ctx.lineTo(a, b) : ctx.moveTo(a, b));
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
  ctx.textBaseline = 'alphabetic';
}

function card(x, y, w, h) {
  ctx.fillStyle = 'rgba(14,16,30,.85)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1; ctx.stroke();
}

function drawHud(now) {
  const gr = ctx.createLinearGradient(0, 0, 0, 80);
  gr.addColorStop(0, 'rgba(6,8,16,.75)'); gr.addColorStop(1, 'rgba(6,8,16,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, WW, 80);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  card(12, 10, 128, 42);
  ctx.fillStyle = '#fff'; ctx.font = '22px "Russo One", sans-serif';
  ctx.fillText(state === 'race' ? fmt((now - raceStart) / 1000) : '0:00.0', 76, 32);
  ranking().forEach((p, i) => {
    const x = 150 + i * 180;
    card(x, 10, 172, 42);
    ctx.fillStyle = COLORS[p.c]; ctx.beginPath(); ctx.arc(x + 25, 31, 14, 0, 7); ctx.fill();
    ctx.textAlign = 'center'; ctx.fillStyle = '#10121f'; ctx.font = '17px "Russo One", sans-serif';
    ctx.fillText(i + 1, x + 25, 32);
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = '800 16px Inter, system-ui, sans-serif';
    ctx.fillText(p.name.slice(0, 7), x + 46, 32);
    ctx.textAlign = 'right'; ctx.font = '700 13px Inter, system-ui, sans-serif';
    ctx.fillStyle = p.done ? '#ffd23f' : 'rgba(255,255,255,.65)';
    ctx.fillText(p.done ? fmt(p.time) : `${lapOf(p)}/${LAPS}`, x + 162, 32);
  });
  ctx.textBaseline = 'alphabetic';
}

function drawLights(now) {
  let lit, go, alpha = 1;
  if (state === 'countdown') { lit = Math.min(3, Math.floor((now - stateT) / 1000) + 1); go = false; }
  else if (state === 'race' && now - raceStart < 1300) { lit = 3; go = true; alpha = clamp(1 - (now - raceStart - 800) / 500, 0, 1); }
  else return;
  ctx.save(); ctx.globalAlpha = alpha;
  const cx = WW / 2, cy = WH / 2 - 70;
  ctx.fillStyle = 'rgba(10,12,22,.88)'; ctx.beginPath(); ctx.roundRect(cx - 170, cy - 62, 340, 124, 30); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 2; ctx.stroke();
  for (let k = 0; k < 3; k++) {
    const x = cx - 100 + k * 100, on = go || k < lit;
    if (on) {
      const gr = ctx.createRadialGradient(x, cy, 10, x, cy, 75);
      gr.addColorStop(0, go ? 'rgba(52,208,106,.55)' : 'rgba(255,59,59,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gr; ctx.fillRect(x - 75, cy - 75, 150, 150);
    }
    ctx.fillStyle = on ? (go ? '#34d06a' : '#ff3b3b') : '#2a1d22';
    ctx.beginPath(); ctx.arc(x, cy, 36, 0, 7); ctx.fill();
    if (on) { ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(x - 11, cy - 11, 10, 0, 7); ctx.fill(); }
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (go) {
    const s = easeOutBack(clamp((now - raceStart) / 350, 0, 1));
    ctx.translate(cx, cy + 150); ctx.scale(s, s);
    ctx.font = '130px "Russo One", sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillText('KÖR!', 5, 7);
    ctx.fillStyle = '#34d06a'; ctx.fillText('KÖR!', 0, 0);
  } else {
    ctx.font = '30px "Russo One", sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText('GÖR ER REDO…', cx, cy + 110);
  }
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function drawAnnounce(now) {
  const b = banners[0];
  if (!b) return;
  if (!b.t0) b.t0 = now;
  const t = (now - b.t0) / 1000;
  if (t > 2.6) { banners.shift(); return; }
  const s = t < .35 ? easeOutBack(t / .35) : 1, a = t > 2.2 ? 1 - (t - 2.2) / .4 : 1;
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.translate(WW / 2, 118); ctx.scale(s, s);
  ctx.font = '36px "Russo One", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(b.text).width + 70;
  if (b.gold) {
    const gr = ctx.createLinearGradient(0, -32, 0, 32);
    gr.addColorStop(0, '#ffe066'); gr.addColorStop(1, '#ff9f1c');
    ctx.fillStyle = gr;
  } else ctx.fillStyle = 'rgba(14,16,30,.92)';
  ctx.beginPath(); ctx.roundRect(-w / 2, -32, w, 64, 32); ctx.fill();
  if (!b.gold) { ctx.strokeStyle = b.color || '#fff'; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.fillStyle = b.gold ? '#10121f' : '#fff';
  ctx.fillText(b.text, 0, 2);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function drawConfetti(now, fdt) {
  if (state === 'results' && now - stateT < 4000 && confetti.length < 600) {
    for (let k = 0; k < 3; k++) confetti.push(makeConf(Math.random() * WW, -20, (Math.random() - .5) * 60, 60 + Math.random() * 120));
  }
  confetti = confetti.filter(c => (c.life -= fdt) > 0 && c.y < WH + 30);
  for (const c of confetti) {
    c.vy = Math.min(c.vy + 420 * fdt, 200); c.vx *= 1 - 1.2 * fdt;
    c.x += c.vx * fdt + Math.sin(c.rot) * 20 * fdt; c.y += c.vy * fdt; c.rot += c.vr * fdt;
    const f = Math.abs(Math.cos(c.rot * 1.7));
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.col; ctx.fillRect(-c.w / 2, -c.h * f / 2, c.w, c.h * f + .5);
    ctx.restore();
  }
}

$('startBtn').onclick = tryStart;
$('trackBtn').onclick = () => { loadTrack((trackIdx + 1) % TRACKS.length); if (state === 'results') setState('lobby'); };
$('musicBtn').onclick = () => { Sound.toggleMusic(); updateSoundBtns(); };
$('sfxBtn').onclick = () => { Sound.toggleSfx(); updateSoundBtns(); };
$('fsBtn').onclick = () => document.documentElement.requestFullscreen?.();
addEventListener('keydown', e => {
  if ($('tv').classList.contains('hidden')) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tryStart(); }
  if (e.key === 'm' || e.key === 'M') { Sound.toggleMusic(); updateSoundBtns(); }
});
addEventListener('pointerdown', () => { if (!$('tv').classList.contains('hidden')) Sound.init(); });

// =====================================================================
//  MOBIL – ratt och status
// =====================================================================
let padConn, me = null, lastCarColor = -1;
const ptrs = new Map();
const keys = {};
let steer = 0, brake = 0, lastSentKey = '';

function startPad(joinCode) {
  $('menu').classList.add('hidden');
  $('pad').classList.remove('hidden');
  try { $('nameIn').value = localStorage.getItem('rallyName') || ''; } catch (e) {}
  const peer = new Peer();
  peer.on('open', () => {
    padConn = peer.connect(PREFIX + joinCode, { reliable: true });
    padConn.on('open', () => { $('goBtn').disabled = false; $('goBtn').textContent = 'Kör! 🏁'; });
    padConn.on('data', onPadData);
    padConn.on('close', () => {
      $('ctrl').classList.add('hidden');
      $('nameScreen').classList.remove('hidden');
      $('goBtn').textContent = 'Anslut igen';
      $('goBtn').disabled = false;
      $('goBtn').onclick = () => location.reload();
      $('padMsg').textContent = 'Tappade anslutningen till TV:n.';
    });
    setTimeout(() => {
      if (!padConn.open) $('padMsg').textContent = 'Kunde inte ansluta. Prova att slå av wifi och köra på mobildata.';
    }, 15000);
  });
  peer.on('error', e => {
    $('padMsg').textContent = e.type === 'peer-unavailable'
      ? `Hittade inget spel med koden ${joinCode}. Stämmer koden?` : 'Fel: ' + e.type;
    $('goBtn').textContent = 'Försök igen';
    $('goBtn').disabled = false;
    $('goBtn').onclick = () => location.reload();
  });
}

$('goBtn').onclick = () => {
  const name = $('nameIn').value.trim() || 'Förare';
  try { localStorage.setItem('rallyName', name); } catch (e) {}
  padConn.send({ t: 'hello', name });
  $('nameScreen').classList.add('hidden');
  $('ctrl').classList.remove('hidden');
  keepAwake();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
  setInterval(() => sendPad(true), 150);
};
$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('goBtn').disabled) $('goBtn').click(); });
$('padStart').onclick = () => padConn.send({ t: 'start' });

function onPadData(d) {
  if (d.t === 'me') { me = d; renderPad(); }
  else if (d.t === 'buzz') navigator.vibrate?.(60);
  else if (d.t === 'go') navigator.vibrate?.(250);
  else if (d.t === 'full') $('padMsg').textContent = 'Spelet är fullt (max 8 förare).';
}

function renderPad() {
  if (me.c !== lastCarColor) {
    lastCarColor = me.c;
    $('pad').style.setProperty('--car', COLORS[me.c]);
    $('topCar').innerHTML = carSvg(COLORS[me.c], 40);
    document.querySelector('meta[name=theme-color]').content = COLORS[me.c];
  }
  $('topName').textContent = me.name;
  $('topInfo').textContent = me.st === 'race' && !me.wait && !me.done ? `Varv ${me.lap}/${me.laps}` : '';
  let big = '', sub = '', start = false;
  if (me.wait) { big = '⏳'; sub = 'Du är med i nästa lopp'; }
  else if (me.st === 'lobby') { big = '🏁'; sub = 'Du står på startlinjen!'; start = true; }
  else if (me.st === 'countdown') { big = String(me.cd); sub = 'Gör dig redo…'; }
  else if (me.st === 'race') { big = ord(me.pos); sub = me.done ? '🏁 I mål!' : `av ${me.n} förare`; }
  else if (me.st === 'results') { big = ord(me.pos); sub = ['🥇 Grattis!', '🥈 Snyggt!', '🥉 Bra kört!'][me.pos - 1] || 'Kör igen?'; start = true; }
  $('big').textContent = big;
  $('sub').textContent = sub;
  $('padStart').classList.toggle('hidden', !start);
  $('padStart').textContent = me.st === 'results' ? 'Kör igen' : 'Starta loppet';
}

function updateSteer() {
  let L = keys.ArrowLeft, R = keys.ArrowRight;
  for (const side of ptrs.values()) { if (side === 'L') L = true; else R = true; }
  steer = (R ? 1 : 0) - (L ? 1 : 0);
  brake = L && R ? 1 : 0;
  $('zl').classList.toggle('on', !!L);
  $('zr').classList.toggle('on', !!R);
  $('brakePill').classList.toggle('hidden', !brake);
  sendPad(false);
}

function sendPad(force) {
  if (!padConn || !padConn.open) return;
  const k = steer + ',' + brake;
  if (force || k !== lastSentKey) { lastSentKey = k; padConn.send({ t: 'in', s: steer, b: brake }); }
}

const zones = $('zones');
const sideOf = e => e.clientX < innerWidth / 2 ? 'L' : 'R';
zones.addEventListener('pointerdown', e => { zones.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, sideOf(e)); updateSteer(); });
zones.addEventListener('pointermove', e => { if (ptrs.has(e.pointerId)) { ptrs.set(e.pointerId, sideOf(e)); updateSteer(); } });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  zones.addEventListener(ev, e => { ptrs.delete(e.pointerId); updateSteer(); });
}
zones.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
zones.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => { if (e.key.startsWith('Arrow') && padConn) { keys[e.key] = true; updateSteer(); } });
addEventListener('keyup', e => { if (e.key.startsWith('Arrow') && padConn) { keys[e.key] = false; updateSteer(); } });
addEventListener('blur', () => { ptrs.clear(); for (const k in keys) keys[k] = false; if (padConn) updateSteer(); });

// =====================================================================
$('hostBtn').onclick = startHost;
const goJoin = () => {
  const c = $('codeIn').value.trim().toUpperCase();
  if (c.length === 4) location.search = '?join=' + c;
  else $('menuMsg').textContent = 'Koden ska vara 4 bokstäver';
};
$('joinBtn').onclick = goJoin;
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') goJoin(); });

const joinParam = new URLSearchParams(location.search).get('join');
if (joinParam) startPad(joinParam.trim().toUpperCase());
</script>
